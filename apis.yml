aid: netradyne
name: Netradyne
description: 'Netradyne is a transportation technology company whose Driver·i platform
  brings Edge AI and computer vision to commercial fleet safety and management. In-cab
  camera systems capture 100% of drive time, analyze driving behavior in real time,
  and drive the GreenZone Score, driver self-coaching, managed coaching, GPS tracking,
  and vehicle alerts across trucking, delivery, construction, passenger transit, school
  transportation, and other industries. Netradyne exposes a partner/developer API surface
  (developer.netradyne.com, hosted on Stoplight, behind sign-in) plus a broad integrations
  and installation-partner ecosystem, and publishes a security program certified to ISO
  27001/27017/27018/27701 and HIPAA. Backed by SoftBank Vision Fund.'
